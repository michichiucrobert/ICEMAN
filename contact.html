  <header class="page-header fade-in">
    <h1 class="page-title">Contact Us</h1>
    <p style="color: var(--color-text-muted); max-width: 600px; margin: 0 auto;">Our dedicated concierge team is available 24/7 to assist with your luxury jewelry needs.</p>
  </header>

  <section class="section fade-in delay-1" style="max-width: 600px; margin: 0 auto;">
    <div style="background: var(--color-surface); padding: 3rem; border: 1px solid var(--glass-border);">
      <form>
        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; margin-bottom: 0.5rem; color: var(--color-text-muted);">Name</label>
          <input type="text" style="width: 100%; padding: 1rem; background: transparent; border: 1px solid var(--glass-border); color: #fff;">
        </div>
        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; margin-bottom: 0.5rem; color: var(--color-text-muted);">Email</label>
          <input type="email" style="width: 100%; padding: 1rem; background: transparent; border: 1px solid var(--glass-border); color: #fff;">
        </div>
        <div style="margin-bottom: 2rem;">
          <label style="display: block; margin-bottom: 0.5rem; color: var(--color-text-muted);">Message</label>
          <textarea rows="5" style="width: 100%; padding: 1rem; background: transparent; border: 1px solid var(--glass-border); color: #fff;"></textarea>
        </div>
        <button class="btn btn-primary" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-grid">
      <div class="footer-col">
        <h3 style="font-family: var(--font-heading); font-size: 1.5rem; margin-bottom: 1rem; color: var(--color-platinum);">ICEMAN</h3>
