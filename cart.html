<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Luxury Cart | ICEMAN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cart-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      gap: 3rem;
    }
    .cart-items { flex: 2; }
    .cart-summary {
      flex: 1;
      background: var(--color-surface);
      border: 1px solid var(--glass-border);
      padding: 2rem;
      height: fit-content;
    }
    .cart-item {
      display: flex;
      gap: 1.5rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--glass-border);
    }
    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border: 1px solid var(--glass-border);
    }
    .cart-item-details { flex: 1; }
    .cart-item-title { font-family: var(--font-heading); font-size: 1.2rem; }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      color: var(--color-text-muted);
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-family: var(--font-heading);
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--glass-border);
      color: var(--color-platinum);
    }
    
    @media (max-width: 768px) {
      .cart-container { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar scrolled">
    <a href="index.html" class="logo">ICEMAN</a>
    <div class="nav-links">
      <div class="dropdown">
        <a href="mens.html">Men</a>
        <div class="dropdown-content">
          <a href="mens.html?category=Rings">Rings</a>
          <a href="mens.html?category=Necklaces">Necklaces</a>
          <a href="mens.html?category=Bracelets">Bracelets</a>
          <a href="mens.html?category=Earrings">Earrings</a>
        </div>
      </div>
      <div class="dropdown">
        <a href="womens.html">Women</a>
        <div class="dropdown-content">
          <a href="womens.html?category=Rings">Rings</a>
          <a href="womens.html?category=Necklaces">Necklaces</a>
          <a href="womens.html?category=Bracelets">Bracelets</a>
          <a href="womens.html?category=Earrings">Earrings</a>
        </div>
      </div>
      <a href="about.html">About</a>
    </div>
    <div class="nav-icons">
      <a href="cart.html"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg></a>
    </div>
  </nav>

  <div style="height: 100px;"></div> <!-- Spacer -->

  <section class="section fade-in">
    <h1 style="font-size: 2.5rem; margin-bottom: 3rem; text-align: center;">Your Cart</h1>
    
    <div class="cart-container">
      <div class="cart-items" id="cart-items-container">
        <!-- Javascript will inject items here -->
      </div>
      
      <div class="cart-summary">
        <h3 style="font-family: var(--font-heading); margin-bottom: 1.5rem; font-size: 1.3rem;">Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">€0.00</span>
        </div>
        <div class="summary-row">
          <span>Insured Shipping</span>
          <span>Complimentary</span>
        </div>
        <div class="summary-total">
          <span>Total</span>
          <span id="cart-total">€0.00</span>
        </div>
        <button class="btn btn-primary" style="width: 100%; margin-top: 2rem;">Secure Checkout</button>
        
        <div style="margin-top: 2rem; display: flex; align-items: center; justify-content: center; gap: 1rem; color: var(--color-text-muted); font-size: 0.8rem;">
          <span>🔒 256-bit Secure Encrypted</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-grid">
      <div class="footer-col">
        <h3 style="font-family: var(--font-heading); font-size: 1.5rem; margin-bottom: 1rem; color: var(--color-platinum);">ICEMAN</h3>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
