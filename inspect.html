<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ICEMAN Image Auto-Cropper</title>
  <style>
    body {
      background: #0a0a0c;
      color: #e5e4e2;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-family: 'Cinzel', serif;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 30px;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }
    .container {
      display: flex;
      gap: 30px;
    }
    .panel {
      flex: 1;
      background: #121216;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 20px;
    }
    .preview-panel {
      flex: 1.2;
      background: #121216;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .image-container {
      position: relative;
      overflow: auto;
      max-height: 500px;
      border: 1px solid #333;
      background: #000;
    }
    canvas {
      display: block;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-size: 0.85rem;
      color: #a0a0a5;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #a6d8f5;
    }
    .val {
      font-family: monospace;
      color: #a6d8f5;
      font-size: 0.9rem;
      align-self: flex-end;
      margin-top: -20px;
    }
    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }
    button {
      flex: 1;
      background: linear-gradient(135deg, #1a1a1c, #0f0f11);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s;
      border-radius: 4px;
    }
    button:hover {
      background: #a6d8f5;
      color: #050505;
      border-color: #a6d8f5;
      box-shadow: 0 0 15px rgba(166, 216, 245, 0.4);
    }
    .active-tab {
      background: #a6d8f5 !important;
      color: #050505 !important;
    }
    .cropped-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    .cropped-card {
      background: #1a1a1c;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 4px;
      padding: 10px;
      text-align: center;
    }
    .cropped-card canvas {
      width: 100%;
      height: auto;
      border: 1px solid #333;
      margin-bottom: 8px;
    }
    .cropped-card span {
      font-size: 0.8rem;
      color: #a0a0a5;
    }
  </style>
</head>
<body>

  <h1>ICEMAN Image Auto-Cropper & Slicer</h1>

  <div style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: center;">
    <button id="tab-mens" class="active-tab" onclick="switchTab('mens')">Men's Collection</button>
    <button id="tab-womens" onclick="switchTab('womens')">Women's Collection</button>
  </div>

  <div class="container">
    <!-- Left Panel: Original Image + Grid Controls -->
    <div class="panel">
      <h3 style="margin-top:0; letter-spacing:1px;">Grid Configuration</h3>
      
      <div class="controls">
        <div class="control-group">
          <label>Global Offset X</label>
          <input type="range" id="offsetX" min="0" max="500" value="0">
          <div class="val" id="val-offsetX">0</div>
        </div>
        <div class="control-group">
          <label>Global Offset Y</label>
          <input type="range" id="offsetY" min="0" max="500" value="0">
          <div class="val" id="val-offsetY">0</div>
        </div>
        <div class="control-group">
          <label>Card Width</label>
          <input type="range" id="cardW" min="100" max="600" value="250">
          <div class="val" id="val-cardW">250</div>
        </div>
        <div class="control-group">
          <label>Card Height</label>
          <input type="range" id="cardH" min="100" max="600" value="250">
          <div class="val" id="val-cardH">250</div>
        </div>
        <div class="control-group">
          <label>Horizontal Gap</label>
          <input type="range" id="gapX" min="-100" max="200" value="20">
          <div class="val" id="val-gapX">20</div>
        </div>
        <div class="control-group">
          <label>Vertical Gap</label>
          <input type="range" id="gapY" min="-100" max="200" value="20">
          <div class="val" id="val-gapY">20</div>
        </div>
      </div>

      <div class="image-container">
        <canvas id="sourceCanvas"></canvas>
      </div>
    </div>

    <!-- Right Panel: Cropped Previews -->
    <div class="preview-panel">
      <h3 style="margin-top:0; letter-spacing:1px;">Cropped Previews</h3>
      
      <div class="cropped-grid" id="croppedGrid">
        <!-- Generated Dynamically -->
      </div>

      <div class="btn-group">
        <button onclick="saveAllImages()" style="background: linear-gradient(135deg, #a6d8f5, #7ebad8); color: #050505; font-weight: bold;">Save All to Assets</button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'mens';
    const images = {
      mens: {
        src: 'assets/assetsmens_products.jpg.png',
        loaded: false,
        img: new Image(),
        // Good defaults for men's sheet (based on actual visual scan)
        offsetX: 0,
        offsetY: 0,
        cardW: 334,
        cardH: 345,
        gapX: 18,
        gapY: 55,
        cols: 4,
        rows: 2,
        names: ['mens_1', 'mens_2', 'mens_3', 'mens_4', 'mens_5', 'mens_6']
      },
      womens: {
        src: 'assets/assetswomens_products.jpg.png',
        loaded: false,
        img: new Image(),
        // Good defaults for women's sheet
        offsetX: 20,
        offsetY: 10,
        cardW: 330,
        cardH: 326,
        gapX: 42,
        gapY: 165,
        cols: 3,
        rows: 2,
        names: ['womens_1', 'womens_2', 'womens_3', 'womens_4', 'womens_5', 'womens_6']
      }
    };

    // Initialize
    window.onload = () => {
      // Load Men's
      images.mens.img.src = images.mens.src;
      images.mens.img.onload = () => {
        images.mens.loaded = true;
        updateSliderLimits('mens');
        loadPreset('mens');
        draw();
      };

      // Load Women's
      images.womens.img.src = images.womens.src;
      images.womens.img.onload = () => {
        images.womens.loaded = true;
      };

      // Event Listeners for controls
      ['offsetX', 'offsetY', 'cardW', 'cardH', 'gapX', 'gapY'].forEach(id => {
        document.getElementById(id).addEventListener('input', (e) => {
          document.getElementById('val-' + id).textContent = e.target.value;
          images[currentTab][id] = parseInt(e.target.value);
          draw();
        });
      });
    };

    function updateSliderLimits(tab) {
      const img = images[tab].img;
      document.getElementById('offsetX').max = img.naturalWidth;
      document.getElementById('offsetY').max = img.naturalHeight;
      document.getElementById('cardW').max = img.naturalWidth;
      document.getElementById('cardH').max = img.naturalHeight;
    }

    function loadPreset(tab) {
      const p = images[tab];
      document.getElementById('offsetX').value = p.offsetX;
      document.getElementById('offsetY').value = p.offsetY;
      document.getElementById('cardW').value = p.cardW;
      document.getElementById('cardH').value = p.cardH;
      document.getElementById('gapX').value = p.gapX;
      document.getElementById('gapY').value = p.gapY;

      ['offsetX', 'offsetY', 'cardW', 'cardH', 'gapX', 'gapY'].forEach(id => {
        document.getElementById('val-' + id).textContent = p[id];
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-mens').className = tab === 'mens' ? 'active-tab' : '';
      document.getElementById('tab-womens').className = tab === 'womens' ? 'active-tab' : '';
      updateSliderLimits(tab);
      loadPreset(tab);
      draw();
    }

    function getCardRects(tab) {
      const p = images[tab];
      const rects = [];
      let count = 0;

      for (let r = 0; r < p.rows; r++) {
        for (let c = 0; c < p.cols; c++) {
          if (count >= p.names.length) break;
          
          const x = p.offsetX + c * (p.cardW + p.gapX);
          const y = p.offsetY + r * (p.cardH + p.gapY);
          
          rects.push({
            name: p.names[count],
            x: x,
            y: y,
            w: p.cardW,
            h: p.cardH
          });
          count++;
        }
      }
      return rects;
    }

    function draw() {
      const tab = currentTab;
      const p = images[tab];
      if (!p.loaded) return;

      const canvas = document.getElementById('sourceCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = p.img.naturalWidth;
      canvas.height = p.img.naturalHeight;

      // Draw original image
      ctx.drawImage(p.img, 0, 0);

      // Get rects
      const rects = getCardRects(tab);

      // Draw grids
      ctx.strokeStyle = '#a6d8f5';
      ctx.lineWidth = 3;
      ctx.font = '16px Montserrat';
      ctx.fillStyle = '#a6d8f5';

      rects.forEach(rect => {
        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        ctx.fillText(rect.name, rect.x + 5, rect.y + 20);
      });

      // Update previews
      updatePreviews(rects);
    }

    function updatePreviews(rects) {
      const tab = currentTab;
      const p = images[tab];
      const grid = document.getElementById('croppedGrid');
      grid.innerHTML = '';

      rects.forEach((rect, index) => {
        const card = document.createElement('div');
        card.className = 'cropped-card';

        const canvas = document.createElement('canvas');
        canvas.width = rect.w;
        canvas.height = rect.h;
        const ctx = canvas.getContext('2d');

        // Draw crop
        ctx.drawImage(p.img, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);

        card.appendChild(canvas);

        const span = document.createElement('span');
        span.textContent = rect.name + '.jpg';
        card.appendChild(span);

        grid.appendChild(card);
      });
    }

    async function saveAllImages() {
      const tab = currentTab;
      const rects = getCardRects(tab);
      const p = images[tab];

      for (let i = 0; i < rects.length; i++) {
        const rect = rects[i];
        
        // Create canvas to convert to base64
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = rect.w;
        tempCanvas.height = rect.h;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(p.img, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);

        const base64Image = tempCanvas.toDataURL('image/jpeg', 0.9);

        // POST to our server
        try {
          const res = await fetch('http://localhost:3100/save-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: rect.name + '.jpg',
              image: base64Image
            })
          });
          const result = await res.json();
          if (result.success) {
            console.log(`Saved ${rect.name}`);
          }
        } catch (err) {
          console.error(`Error saving ${rect.name}:`, err);
        }
      }
      alert(`All 6 ${tab} images successfully cropped and saved!`);
    }
  </script>
</body>
</html>
